id = "open-in-zed"
name = "Open in Zed"
version = "0.1.0"
description = "Open workspace folders, pane folders, and selected file paths in the Zed editor."
min_herdr_version = "0.9.0"
platforms = ["macos"]

# Right-click a workspace in the sidebar.
[[actions]]
id = "open-workspace"
title = "Open in Zed"
description = "Open this workspace's folder in Zed."
contexts = ["workspace"]
command = ["bash", "bin/open-in-zed.sh", "workspace"]

# Right-click a pane: opens the folder the pane's shell or agent is in.
[[actions]]
id = "open-pane-folder"
title = "Open folder in Zed"
description = "Open the focused pane's working directory in Zed."
contexts = ["pane"]
command = ["bash", "bin/open-in-zed.sh", "pane"]

# Select a path an agent printed (double-click or drag), then right-click.
# Accepts src/app.ts, ./a/b.tsx:12, /abs/path:12:3, path#L12, Read(src/x.ts).
[[actions]]
id = "open-selection"
title = "Open in Zed"
description = "Open the selected file or folder path in Zed, at its line if one is given."
contexts = ["selection"]
command = ["bash", "bin/open-in-zed.sh", "selection"]

# Target of the link handlers below; not shown in menus.
[[actions]]
id = "open-link"
title = "Open link in Zed"
command = ["bash", "bin/open-in-zed.sh", "link"]

# Ctrl+click a file:// hyperlink.
[[link_handlers]]
id = "file-url"
title = "Open in Zed"
pattern = "^file://"
action = "open-link"

# Ctrl+click an editor deep link such as the vscode://file/<path>:<line> links
# some agents emit for file citations.
[[link_handlers]]
id = "editor-file-url"
title = "Open in Zed"
pattern = "^(vscode|vscode-insiders|cursor|windsurf)://file/"
action = "open-link"
