id = "open-in-editor"
name = "Open in Editor"
version = "0.2.0"
description = "Open file paths your agent prints, or the whole workspace, in Zed, VS Code, Cursor, Sublime Text, or Android Studio at the exact line."
# 0.9.0 is the first release that routes OSC 8 file:// clicks to link handlers.
min_herdr_version = "0.9.0"
platforms = ["macos"]

# herdr doesn't show plugin actions in its right-click menus yet, so these are
# run from keybindings (see README). The contexts say where each action
# belongs if menus start listing them.

[[actions]]
id = "open-workspace"
title = "Open in editor"
description = "Open this workspace's folder in your editor."
contexts = ["workspace"]
command = ["bash", "bin/open-in-editor.sh", "workspace"]

# Opens the folder the focused pane's shell or agent is in.
[[actions]]
id = "open-pane-folder"
title = "Open folder in editor"
description = "Open the focused pane's working directory in your editor."
contexts = ["pane"]
command = ["bash", "bin/open-in-editor.sh", "pane"]

# Opens a path an agent printed, after you double-click or drag-select it.
# Accepts src/app.ts, ./a/b.tsx:12, /abs/path:12:3, path#L12, Read(src/x.ts).
[[actions]]
id = "open-selection"
title = "Open in editor"
description = "Open the selected file or folder path in your editor, at its line if one is given."
contexts = ["selection"]
command = ["bash", "bin/open-in-editor.sh", "selection"]

# Target of the link handlers below; not shown in menus.
[[actions]]
id = "open-link"
title = "Open link in editor"
command = ["bash", "bin/open-in-editor.sh", "link"]

# Ctrl+click a file:// hyperlink.
[[link_handlers]]
id = "file-url"
title = "Open in editor"
pattern = "^file://"
action = "open-link"

# Ctrl+click an editor deep link such as the vscode://file/<path>:<line> links
# some agents emit for file citations.
[[link_handlers]]
id = "editor-file-url"
title = "Open in editor"
pattern = "^(vscode|vscode-insiders|cursor|windsurf)://file/"
action = "open-link"
